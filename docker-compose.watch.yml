# Opcional — Compose Watch (rebuild al cambiar código). Requiere Docker Compose con soporte `develop`.
# Uso: docker compose -f docker-compose.yml -f docker-compose.watch.yml watch
services:
  futurefin:
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
        - action: rebuild
          path: ./crates/domain
        - action: rebuild
          path: ./apps/web
          ignore:
            - "**/node_modules/**"
            - "**/dist/**"
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
