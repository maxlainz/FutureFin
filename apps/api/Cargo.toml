[package]
name = "futurefin-api"
version = "4.12.3"
edition = "2021"
description = "FutureFin HTTP API (self-hosted)"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/maxlainz/FutureFin"
authors = ["Max Lainz"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.6"
async-trait = "0.1"
base64 = "0.22"
csv = "1"
encoding_rs = "0.8"
flate2 = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
rust_decimal = { version = "1.41", features = ["serde-with-str"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
cookie = "0.18"
dotenvy = "0.15"
futurefin-domain = { path = "../../crates/domain" }
futurefin-engine = { path = "../../crates/engine", features = ["openapi"] }
http = "1"
# TLS: `rustls-tls` en las DOS dependencias que hablan con Home Assistant (reqwest y
# tokio-tungstenite). `default-tls` arrastraría OpenSSL, que la imagen runtime NO lleva; y
# `rustls-tls-webpki-roots` empaqueta el almacén de certificados, así que tampoco depende del
# `ca-certificates` del sistema. Una sola major de rustls en el árbol (gate: `cargo tree -d`).
# tokio-tungstenite (y no async-tungstenite): este repo es tokio-only y no necesita el
# abstractor de runtimes. NUNCA `danger_accept_invalid_certs`: un HA con certificado
# autofirmado no está soportado por diseño — se accede por http en la LAN o con un cert válido.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "rust_decimal",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# El doble de `HaIdp` de `tests/common` implementa un trait `#[async_trait]`, y los tests de
# integración son su propio crate: necesitan la macro aunque la lib ya dependa de ella.
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
# Los tests del login con HA parsean el `Location` del redirect en vez de compararlo como texto.
url = "2"
http-body-util = "0.1"
