[package]
name = "futurefin-api"
version = "2.3.0"
edition = "2021"
description = "FutureFin HTTP API (self-hosted)"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
csv = "1"
encoding_rs = "0.8"
flate2 = "1.0"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
rust_decimal = { version = "1.41", features = ["serde-with-str"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
cookie = "0.18"
dotenvy = "0.15"
futurefin-domain = { path = "../../crates/domain" }
futurefin-engine = { path = "../../crates/engine" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "rust_decimal",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
