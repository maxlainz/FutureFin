services:
  caddy:
    image: caddy:2-alpine
    container_name: futurefin-caddy
    restart: unless-stopped
    depends_on:
      - futurefin
    environment:
      FUTUREFIN_DOMAIN: ${FUTUREFIN_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - futurefin-net

volumes:
  caddy_data:
  caddy_config:

