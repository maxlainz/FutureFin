name: Publish Docker image

# FALLBACK MANUAL. El camino normal de publicación es `./scripts/publish-image-local.sh`.
#
# Por qué ya NO se dispara con el tag: los runners son amd64, así que la mitad arm64 se
# construye EMULADA bajo QEMU y un release tardaba ~1,5-2 h. En agosto de 2026 eso fueron 958
# de los ~1460 min consumidos (el 66 % de la cuota) para un build cuyo cómputo real son ~3,5
# min. Publicando en local con containerd image store salen las dos arquitecturas de una vez y
# el gasto aquí es cero.
#
# Úsalo cuando no puedas publicar desde tu máquina (otro equipo, sin Docker, sin credenciales).
# Hace exactamente lo mismo que el script: mismas registries, mismos tags y el mismo Release.
#
# Tags publicados por registry:
#   vX.Y.Z  →  :1.0.0  :1.0  :1  :latest
#
# Secretos:
#   (ninguno)           — GHCR usa GITHUB_TOKEN automáticamente
#   DOCKERHUB_USERNAME  — usuario u org de Docker Hub (opcional)
#   DOCKERHUB_TOKEN     — token de acceso de Docker Hub (opcional)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.0.0)"
        required: true

permissions:
  # `contents: write` es lo que permite crear el GitHub Release del tag; el
  # checkout sigue usando `persist-credentials: false`, así que el token solo
  # viaja como GH_TOKEN al paso que publica las notas.
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Resolve image list
        id: images
        run: |
          images="ghcr.io/${{ github.repository_owner }}/futurefin"
          images="${images}"$'\n'"maxlainz/futurefin"
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Solo después de que la imagen esté publicada: un Release que anuncie una
      # versión inexistente es peor que no tener Release. Las notas salen del
      # CHANGELOG vía `scripts/changelog-section.sh` — misma fuente de verdad que
      # el backfill manual de 3.0.0…3.8.0, para que no haya dos formatos.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # `github.ref_name` sería la RAMA en un workflow_dispatch, no el tag: el tag es el
          # input, el mismo que resuelve el checkout de arriba.
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release $TAG ya existe — no lo toco"
            exit 0
          fi
          ./scripts/changelog-section.sh "$TAG" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
