name: Publish Docker image

# Publishes on explicit semver tags (v1.0.0, v1.2.3, …).
# GHCR always; Docker Hub if DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are set.
#
# Tags published per registry:
#   vX.Y.Z  →  :1.0.0  :1.0  :1  :latest
#
# Required secrets:
#   (none)              — GHCR uses GITHUB_TOKEN automatically
#   DOCKERHUB_USERNAME  — Docker Hub user or org (optional)
#   DOCKERHUB_TOKEN     — Docker Hub access token  (optional)
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   DOCKERHUB_IMAGE     — repositorio de Docker Hub (por defecto maxlainz/futurefin)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.0.0)"
        required: true

permissions:
  # `contents: write` es lo que permite crear el GitHub Release del tag; el
  # checkout sigue usando `persist-credentials: false`, así que el token solo
  # viaja como GH_TOKEN al paso que publica las notas.
  contents: write
  packages: write
  # `actions: read` lo necesita el job `ci-gate` para consultar el resultado de
  # las ejecuciones de ci.yml sobre el commit del tag.
  actions: read

jobs:
  # ── Puerta: sin CI verde no se publica nada ──────────────────────────────────
  # Hasta agosto de 2026 un `git push --tags` publicaba imagen multi-arch Y GitHub
  # Release aunque la CI de ese commit estuviera en rojo: nada las conectaba.
  #
  # Por qué esta solución y no otra:
  #   - `needs:` NO sirve: solo enlaza jobs DENTRO del mismo workflow, y CI vive en
  #     ci.yml.
  #   - `on: workflow_run` NO sirve: ci.yml se dispara con `push: branches:
  #     [main, dev]`, nunca con tags, así que empujar un tag no produce ninguna
  #     ejecución de CI a la que encadenarse. Cambiar ci.yml para que corriera
  #     también en tags solo duplicaría el trabajo (mismo commit, mismos tests) y
  #     dejaría el `workflow_dispatch` de reconstrucción sin cubrir.
  #   - Rama elegida: preguntar a la API por el resultado de ci.yml sobre el SHA
  #     EXACTO al que apunta el tag. El flujo de release (CLAUDE.md § Git workflow)
  #     hace merge completo dev→main, empuja main y después taguea, así que ese
  #     commit siempre ha pasado por CI en main. Es una comprobación sobre un
  #     hecho ya ocurrido, no una carrera.
  # Espera con límite porque el tag suele empujarse segundos después del push de
  # main y la CI todavía está corriendo.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        # El input del dispatch va por `env`, no interpolado en el shell: estos jobs sostienen
        # DOCKERHUB_TOKEN y `packages: write`, así que una expresión sin sanear aquí sería
        # ejecución arbitraria con esas credenciales delante.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag inválido: '$INPUT_TAG' (se espera vX.Y.Z)"; exit 1 ;;
            esac
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GH_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: CI verde en el commit del tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          echo "Comprobando la CI del commit ${SHA}…"

          for i in $(seq 1 60); do
            runs="$(gh api --paginate \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status)\t\(.conclusion)\t\(.html_url)"' || true)"

            if [ -z "${runs}" ]; then
              # Reconstrucción manual de un tag antiguo: la ejecución de CI puede
              # haber caducado por retención. No es motivo para bloquear a alguien
              # que ha pedido la reconstrucción a mano y a sabiendas.
              if [ "${EVENT}" = "workflow_dispatch" ] && [ "${i}" -ge 2 ]; then
                echo "AVISO: no hay ninguna ejecución de CI para ${SHA} (¿retención caducada?)."
                echo "Es un workflow_dispatch manual — continúo."
                exit 0
              fi
              echo "  [${i}/60] aún no hay ejecuciones de CI para este commit…"
              sleep 30
              continue
            fi

            if printf '%s\n' "${runs}" | grep -qv '^completed'; then
              echo "  [${i}/60] CI todavía en marcha:"
              printf '%s\n' "${runs}" | sed 's/^/    /'
              sleep 30
              continue
            fi

            echo "Ejecuciones de CI sobre ${SHA}:"
            printf '%s\n' "${runs}" | sed 's/^/  /'

            # Un mismo commit puede tener varias ejecuciones (el push a dev y el
            # push a main son el mismo SHA). Basta UNA en rojo para no publicar.
            # Las canceladas se ignoran: cancelar una ejecución redundante es un
            # acto deliberado, no un fallo.
            if printf '%s\n' "${runs}" \
                 | grep -qE '^completed[[:space:]]+(failure|timed_out|action_required|startup_failure)'; then
              echo "ERROR: la CI de este commit NO está verde. No se publica ni imagen ni Release."
              exit 1
            fi
            if ! printf '%s\n' "${runs}" | grep -qE '^completed[[:space:]]+success'; then
              echo "ERROR: ninguna ejecución de CI de este commit concluyó con éxito."
              exit 1
            fi

            echo "OK: CI verde sobre ${SHA}."
            exit 0
          done

          echo "ERROR: 30 minutos esperando a la CI de ${SHA} y sigue sin concluir."
          echo "Revisa https://github.com/${REPO}/actions y vuelve a lanzar el workflow."
          exit 1

  build-and-push:
    needs: ci-gate
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        # El input del dispatch va por `env`, no interpolado en el shell: estos jobs sostienen
        # DOCKERHUB_TOKEN y `packages: write`, así que una expresión sin sanear aquí sería
        # ejecución arbitraria con esas credenciales delante.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag inválido: '$INPUT_TAG' (se espera vX.Y.Z)"; exit 1 ;;
            esac
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GH_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      # El tag es lo único que decide qué se publica, y nada comprobaba que dijera la verdad.
      # Un `git tag v4.0.1` sobre un commit cuyo Cargo.toml sigue en 4.0.0 publicaba `:4.0.1`,
      # `:4.0`, `:4` y `:latest` de una imagen que reporta 4.0.0 — y el entrypoint escribe esa
      # versión en su estado, con lo que el backup automático pre-migración deja de dispararse
      # en el arranque siguiente. Además el paso del Release usa `changelog-section.sh`, que
      # falla si la sección no existe: mejor fallar aquí que con la imagen ya publicada.
      - name: Tag matches version and CHANGELOG
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cargo_version="$(grep -m1 '^version' apps/api/Cargo.toml | cut -d'"' -f2)"
          if [ "v${cargo_version}" != "$TAG" ]; then
            echo "::error::el tag ${TAG} no coincide con apps/api/Cargo.toml (v${cargo_version})"
            exit 1
          fi
          ./scripts/changelog-section.sh "$TAG" > /dev/null

      # `:latest`, `:X` y `:X.Y` son móviles: reconstruir una versión antigua los hacía
      # RETROCEDER. El caso no es hipotético — este mismo workflow contempla reconstruir un tag
      # viejo por dispatch —, y `docker-compose.yml` usa `${FUTUREFIN_TAG:-latest}`, así que
      # quien actualice con watchtower recibiría un downgrade sobre un volumen ya migrado. Nada
      # protege el esquema de la app frente a eso: `maybe_pg_upgrade` cubre el major de
      # PostgreSQL, no las migraciones de sqlx.
      - name: Is this the newest tag?
        id: newest
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          newest="$(git ls-remote --tags --refs "https://github.com/${REPO}" \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)"
          newest="$(printf '%s\n%s\n' "$newest" "$TAG" | sort -V | tail -1)"
          if [ "$newest" = "$TAG" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${TAG} no es el tag más alto (${newest}): NO se moverán :latest, :X ni :X.Y"
          fi

      # El nombre de Docker Hub estaba a fuego. En un fork sin secretos eso no
      # fallaba en el login (que ni siquiera tenía `if:`) sino MÁS TARDE, al hacer
      # push: la lista de imágenes entra en `docker/metadata-action`, y
      # `build-push-action` empuja TODOS los tags que salen de ahí. Por eso no basta
      # con condicionar el login: hay que dejar la imagen de Docker Hub fuera de la
      # lista cuando no hay credenciales, y entonces el fork publica solo en su GHCR.
      # El nombre sale de la variable de repositorio DOCKERHUB_IMAGE (por defecto el
      # de siempre) para que un fork pueda apuntar al suyo sin tocar el workflow.
      - name: Resolve image list
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'maxlainz/futurefin' }}
        run: |
          set -euo pipefail
          images="ghcr.io/${{ github.repository_owner }}/futurefin"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"${DOCKERHUB_IMAGE}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub: ${DOCKERHUB_IMAGE}"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Sin DOCKERHUB_USERNAME: publico solo en GHCR."
          fi
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.value == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.value == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.value == 'true' }}
          # Etiquetas OCI explícitas. La imagen solo llevaba la suya propia
          # (`com.futurefin.postgres.majors`, en el Dockerfile) y ninguna estándar.
          # `image.source` es la que hace que GHCR enlace el package con este
          # repositorio y herede su README y su visibilidad; sin ella el package
          # aparece huérfano. No las dejamos a la autodetección de metadata-action
          # porque `licenses` sale de la API de licencias de GitHub, que no responde
          # igual en un repo privado ni en un fork.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=FutureFin
            org.opencontainers.image.description=Finanzas del hogar y planificación FIRE, autoalojadas en un solo contenedor con PostgreSQL incluido.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=maxlainz

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Condicionado sobre la salida del paso anterior y no sobre `secrets.*`
      # directamente: el contexto `secrets` no está disponible en las expresiones
      # `if:`, así que la presencia del secreto se resuelve una vez en bash y se
      # propaga como output.
      - name: Login to Docker Hub
        if: steps.images.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # En multi-arch las labels viajan en la config de cada imagen hija, no en
          # el índice; las anotaciones sí van en el índice, que es lo que leen GHCR
          # y Docker Hub para enlazar el package con el repositorio.
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Solo después de que la imagen esté publicada: un Release que anuncie una
      # versión inexistente es peor que no tener Release. Las notas salen del
      # CHANGELOG vía `scripts/changelog-section.sh` — misma fuente de verdad que
      # el backfill manual de 3.0.0…3.8.0, para que no haya dos formatos.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release $TAG ya existe — no lo toco"
            exit 0
          fi
          ./scripts/changelog-section.sh "$TAG" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
