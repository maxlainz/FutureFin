name: Publish Docker image

# Publica por TRES vías: auto-tag on merge (push a main con versión sin tag en Cargo.toml —
# la vía normal desde 4.0.6), push explícito de un tag semver (v1.0.0, …), y workflow_dispatch
# (reconstrucciones; con create_tag, versión nueva — idempotente si el tag ya existe).
# GHCR always; Docker Hub if DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are set.
#
# Tags published per registry:
#   vX.Y.Z  →  :1.0.0  :1.0  :1  :latest
#
# Required secrets:
#   ADDON_BUMP_APP_ID          — id de la GitHub App futurefin-release-bot (4770261)
#   ADDON_BUMP_APP_PRIVATE_KEY — su clave privada (rotable desde la página de la App)
#     → firman el bump del add-on en main; la App es bypass actor del ruleset «Proteger
#       main». Sin ellos, el último paso falla y el add-on queda una versión por detrás
#       (la imagen y el Release salen igual). Runbook: futurefin-run-and-operate §canal add-on.
#   DOCKERHUB_USERNAME  — Docker Hub user or org (optional)
#   DOCKERHUB_TOKEN     — Docker Hub access token  (optional)
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   DOCKERHUB_IMAGE     — repositorio de Docker Hub (por defecto maxlainz/futurefin)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Auto-tag on merge (4.0.6): cada push a main comprueba si Cargo.toml lleva una versión
    # sin tag. Si no (merge de docs/CI, o versión ya publicada), el run es un no-op verde de
    # segundos. Si sí, ESTE MISMO run verifica CHANGELOG + CI verde + orden estricto, crea el
    # tag y sigue construyendo — el merge del bump ES la publicación, que es lo que la norma
    # «una versión, una imagen» siempre quiso: un bump mergeado no puede quedarse sin imagen.
    # (branches y tags en el mismo `push` se disparan por CUALQUIERA de los dos — semántica OR.)
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vX.Y.Z a construir (o a crear, si marcas la casilla de abajo)"
        required: true
      create_tag:
        description: "Crear el tag sobre main si no existe (publica una versión nueva)"
        type: boolean
        default: false

permissions:
  # `contents: write` es lo que permite crear el GitHub Release del tag; el
  # checkout sigue usando `persist-credentials: false`, así que el token solo
  # viaja como GH_TOKEN al paso que publica las notas.
  contents: write
  packages: write
  # `actions: read` lo necesita el job `ci-gate` para consultar el resultado de
  # las ejecuciones de ci.yml sobre el commit del tag.
  actions: read

jobs:
  # ── Puerta: sin CI verde no se publica nada ──────────────────────────────────
  # Hasta agosto de 2026 un `git push --tags` publicaba imagen multi-arch Y GitHub
  # Release aunque la CI de ese commit estuviera en rojo: nada las conectaba.
  #
  # Por qué esta solución y no otra:
  #   - `needs:` NO sirve: solo enlaza jobs DENTRO del mismo workflow, y CI vive en
  #     ci.yml.
  #   - `on: workflow_run` NO sirve: ci.yml se dispara con `push: branches:
  #     [main, dev]`, nunca con tags, así que empujar un tag no produce ninguna
  #     ejecución de CI a la que encadenarse. Cambiar ci.yml para que corriera
  #     también en tags solo duplicaría el trabajo (mismo commit, mismos tests) y
  #     dejaría el `workflow_dispatch` de reconstrucción sin cubrir.
  #   - Rama elegida: preguntar a la API por el resultado de ci.yml sobre el SHA
  #     EXACTO al que apunta el tag. El flujo de release (.claude/git-and-releases.md):
  #     el bump entra a main por PR con CI verde y el tag se crea sobre ese commit
  #     de main (auto-tag tras ver la CI verde, o tag manual sobre main), así que
  #     ese commit siempre ha pasado por CI en main. Es una comprobación sobre un
  #     hecho ya ocurrido, no una carrera.
  # Espera con límite porque el tag suele empujarse segundos después del push de
  # main y la CI todavía está corriendo.
  ci-gate:
    runs-on: ubuntu-latest
    # `publish` gobierna si el job de build corre: '' (vacío, modos tag-push y rebuild) y
    # 'true' publican; 'false' (merge sin bump, o tag ya creado por otra vía) lo salta.
    # `tag` solo lo consume el resolve del build en modo merge (ahí github.ref es la rama).
    outputs:
      publish: ${{ steps.mkdisp.outputs.publish || steps.mktag.outputs.publish || steps.decide.outputs.candidate_ok }}
      tag: ${{ steps.decide.outputs.tag || steps.ref.outputs.tag }}
    steps:
      - name: Resolve ref
        id: ref
        # El input del dispatch va por `env`, no interpolado en el shell: estos jobs sostienen
        # DOCKERHUB_TOKEN y `packages: write`, así que una expresión sin sanear aquí sería
        # ejecución arbitraria con esas credenciales delante.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag inválido: '$INPUT_TAG' (se espera vX.Y.Z)"; exit 1 ;;
            esac
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [ "$GH_REF" = "refs/heads/main" ]; then
            # Merge a main: el tag candidato sale del Cargo.toml del commit empujado, que
            # necesita checkout — se resuelve en el paso `decide`. El checkout genérico de
            # abajo, con ref vacío, baja exactamente github.sha (default del evento push).
            echo "mode=merge" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GH_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ── Crear el tag desde aquí, y no con `git push` ────────────────────────
      # Existe porque el tag es el único gesto del release que no se podía delegar: un agente
      # (o cualquier automatismo con un token acotado) puede mergear a `main` pero recibe 403
      # al empujar un tag. Quedaba `main` con la versión subida y sin imagen publicada, que es
      # justo lo que la norma de «una versión, una imagen» prohíbe.
      #
      # Y se hace DENTRO de este workflow, no en uno aparte, por una razón que no es de estilo:
      # un tag empujado con GITHUB_TOKEN **no dispara** `on: push: tags` (GitHub lo impide para
      # evitar recursión). Un workflow «crear tag» dejaría el tag creado y la imagen sin
      # publicar — peor que el fallo actual, porque parecería que funcionó. Creándolo aquí no
      # hay segundo workflow al que disparar: esta misma ejecución sigue y construye.
      #
      # Las comprobaciones se hacen ANTES de crear el tag: un tag equivocado ya publicado es
      # mucho más caro de deshacer que un job en rojo.
      - name: Checkout main (solo si se va a crear el tag)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Crear el tag sobre main
        id: mkdisp
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail

          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            # Idempotente desde el auto-tag on merge: si el merge del bump ya creó el tag
            # (o dos automatismos se cruzan — la rutina de dependencias dispara este dispatch
            # tras sus merges), «ya existe» no es un error: es que no queda nada que crear.
            # El run termina VERDE sin construir; reconstruir un tag existente sigue siendo
            # el dispatch SIN la casilla.
            echo "El tag ${TAG} ya existe: nada que crear (¿lo publicó ya el auto-tag del merge?)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Las mismas dos verdades que comprueba el job de build, pero antes de que el tag
          # exista: que la versión del binario coincide, y que hay notas que publicar.
          cargo_version="$(grep -m1 '^version' apps/api/Cargo.toml | cut -d'"' -f2)"
          if [ "v${cargo_version}" != "$TAG" ]; then
            echo "::error::main está en ${cargo_version} y pides tag ${TAG}. Mergea el bump de versión primero."
            exit 1
          fi
          ./scripts/changelog-section.sh "$TAG" > /dev/null

          sha="$(git rev-parse HEAD)"
          echo "Creando ${TAG} sobre main (${sha})…"
          gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${sha}" --silent
          echo "Tag ${TAG} creado. La CI de ${sha} se verifica en el paso siguiente."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.mkdisp.outputs.publish != 'false' }}
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Resolve commit
        id: sha
        if: ${{ steps.mkdisp.outputs.publish != 'false' }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ── Auto-tag on merge: ¿este push a main publica algo? ──────────────────
      # Se decide ANTES de esperar a la CI, con las comprobaciones baratas: versión del
      # Cargo.toml del commit empujado, ¿tiene ya su tag?, ¿hay sección en el CHANGELOG?
      # Pero el tag NO se crea aquí: se crea al FINAL del job (paso `mktag`), cuando la CI
      # del commit ya está verde y el orden estricto comprobado. A diferencia del dispatch
      # (que crea el tag primero y verifica después, porque quien lo lanza ya vio la CI),
      # aquí la CI del commit acaba de arrancar: crear el tag antes de verla dejaría un tag
      # sin imagen cada vez que un bump mergease con la CI rota.
      - name: Decidir si el merge publica
        id: decide
        if: ${{ steps.ref.outputs.mode == 'merge' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cargo_version="$(grep -m1 '^version' apps/api/Cargo.toml | cut -d'"' -f2)"
          TAG="v${cargo_version}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "El tag ${TAG} ya existe: merge sin bump (docs/CI) o versión ya publicada. Nada que hacer."
            echo "candidate_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La sección del CHANGELOG debe existir ANTES de esperar 20 min de CI: el job
          # `rust` de ci.yml también lo audita, pero fallar aquí es inmediato y sin tag creado.
          ./scripts/changelog-section.sh "$TAG" > /dev/null

          echo "Versión ${cargo_version} sin tag: este merge publica ${TAG} si su CI acaba en verde."
          echo "candidate_ok=true" >> "$GITHUB_OUTPUT"

      - name: CI verde en el commit del tag
        if: ${{ steps.mkdisp.outputs.publish != 'false' && steps.decide.outputs.candidate_ok != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
        run: |
          set -euo pipefail

          echo "Comprobando la CI del commit ${SHA}…"

          for i in $(seq 1 60); do
            runs="$(gh api --paginate \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status)\t\(.conclusion)\t\(.html_url)"' || true)"

            if [ -z "${runs}" ]; then
              # Reconstrucción manual de un tag antiguo: la ejecución de CI puede
              # haber caducado por retención. No es motivo para bloquear a alguien
              # que ha pedido la reconstrucción a mano y a sabiendas.
              #
              # Pero NO cuando se está creando el tag: ahí no hay retención caducada que
              # valga —el commit es la punta de `main`, de hoy—, y saltarse la puerta
              # publicaría una versión NUEVA sin que nada la haya verificado. Si no aparece
              # ninguna ejecución, es que algo va mal; que falle.
              if [ "${EVENT}" = "workflow_dispatch" ] && [ "${CREATE_TAG}" != "true" ] && [ "${i}" -ge 2 ]; then
                echo "AVISO: no hay ninguna ejecución de CI para ${SHA} (¿retención caducada?)."
                echo "Es un workflow_dispatch manual — continúo."
                exit 0
              fi
              echo "  [${i}/60] aún no hay ejecuciones de CI para este commit…"
              sleep 30
              continue
            fi

            if printf '%s\n' "${runs}" | grep -qv '^completed'; then
              echo "  [${i}/60] CI todavía en marcha:"
              printf '%s\n' "${runs}" | sed 's/^/    /'
              sleep 30
              continue
            fi

            echo "Ejecuciones de CI sobre ${SHA}:"
            printf '%s\n' "${runs}" | sed 's/^/  /'

            # Un mismo commit puede tener varias ejecuciones (el push a dev y el
            # push a main son el mismo SHA). Basta UNA en rojo para no publicar.
            # Las canceladas se ignoran: cancelar una ejecución redundante es un
            # acto deliberado, no un fallo.
            if printf '%s\n' "${runs}" \
                 | grep -qE '^completed[[:space:]]+(failure|timed_out|action_required|startup_failure)'; then
              echo "ERROR: la CI de este commit NO está verde. No se publica ni imagen ni Release."
              exit 1
            fi
            if ! printf '%s\n' "${runs}" | grep -qE '^completed[[:space:]]+success'; then
              echo "ERROR: ninguna ejecución de CI de este commit concluyó con éxito."
              exit 1
            fi

            echo "OK: CI verde sobre ${SHA}."
            exit 0
          done

          echo "ERROR: 30 minutos esperando a la CI de ${SHA} y sigue sin concluir."
          echo "Revisa https://github.com/${REPO}/actions y vuelve a lanzar el workflow."
          exit 1

      # ── Orden estricto: la versión anterior debe tener su imagen ────────────
      # Cada run de este workflow mira SU tag y nada más, así que hasta agosto de 2026 nada
      # impedía esto: la 4.0.2 muere en su ci-gate (CI roja) y la 4.0.3 —tagueada segundos
      # después por la cadena de la rutina— publica igual. Resultado: un agujero en la
      # escalera de versiones, un tag sin imagen (violando «una versión, una imagen») y
      # quien actualiza salta por encima de una versión que nunca existió.
      #
      # La regla: NO se construye vX.Y.Z hasta que el tag inmediatamente anterior tenga su
      # GitHub Release — que este mismo workflow crea SOLO tras empujar la imagen, así que
      # es el marcador fiable de «imagen publicada» (verificado: 38 tags = 38 Releases).
      #
      # Si el run del tag anterior sigue en marcha, se espera (les separa un build multi-arch
      # de ~2 h; sondeo cada 2 min, tope 165 min). Si NO hay ningún run de este workflow en
      # marcha y el Release sigue sin existir, es que el anterior FALLÓ o nunca se lanzó: se
      # aborta con instrucciones, no se publica por encima.
      - name: La versión anterior tiene su imagen
        if: ${{ steps.mkdisp.outputs.publish != 'false' && steps.decide.outputs.candidate_ok != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.decide.outputs.tag || steps.ref.outputs.tag }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          prev="$(git ls-remote --tags --refs "https://github.com/${REPO}" \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | { cat; echo "$TAG"; } | sort -Vu \
            | grep -B1 -x "$TAG" | head -1)"

          if [ -z "$prev" ] || [ "$prev" = "$TAG" ]; then
            echo "No hay tag anterior a ${TAG}: nada que esperar."
            exit 0
          fi

          echo "Tag anterior: ${prev}. Comprobando que su imagen está publicada…"

          for i in $(seq 1 83); do
            if gh api "repos/${REPO}/releases/tags/${prev}" --jq .tag_name >/dev/null 2>&1; then
              echo "OK: ${prev} tiene su Release (imagen publicada). Continúo con ${TAG}."
              exit 0
            fi

            # ¿Hay OTRO run de este workflow vivo que pueda estar produciéndolo?
            vivos="$(gh api \
              "repos/${REPO}/actions/workflows/publish-image.yml/runs?per_page=30" \
              --jq "[.workflow_runs[] | select(.id != ${THIS_RUN}) \
                     | select(.status == \"in_progress\" or .status == \"queued\")] | length")"

            if [ "${vivos}" -eq 0 ]; then
              echo "ERROR: ${prev} no tiene Release y no queda ningún run de publicación en marcha."
              echo "Su publicación FALLÓ o nunca se lanzó. No se publica ${TAG} por encima de un"
              echo "agujero: arregla ${prev} primero (relanza su publicación, o borra su tag si esa"
              echo "versión no debe existir) y después vuelve a lanzar este workflow."
              exit 1
            fi

            echo "  [${i}/83] ${prev} aún sin Release; ${vivos} run(s) de publicación en marcha. Espero 2 min…"
            sleep 120
          done

          echo "ERROR: 166 minutos esperando la imagen de ${prev} (un build normal tarda ~2 h)."
          echo "Revisa su run en https://github.com/${REPO}/actions antes de relanzar ${TAG}."
          exit 1

      # ── Auto-tag on merge, acto final: crear el tag con todo ya verificado ──
      # A este punto solo se llega en modo merge con candidato, CI verde y orden en regla.
      # Se taguea github.sha (el commit EXACTO del push, no «la punta de main», que podría
      # haber avanzado). Si otro run se adelantó (una carrera de dos merges seguidos, o el
      # dispatch de la rutina), «ya existe» degrada a no-op: el ganador ya construye.
      - name: Crear el tag del merge
        id: mktag
        if: ${{ steps.ref.outputs.mode == 'merge' && steps.decide.outputs.candidate_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.decide.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" --silent; then
            echo "Tag ${TAG} creado sobre ${SHA}. Este run continúa y construye la imagen."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
              echo "Otro run creó ${TAG} mientras esperábamos la CI: le cedo la publicación."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::no se pudo crear el tag ${TAG} (y no existe)."
              exit 1
            fi
          fi

  build-and-push:
    needs: ci-gate
    # 'false' = merge sin bump, tag ya existente o carrera cedida: no hay nada que construir.
    # Vacío ('') = modos tag-push y rebuild por dispatch, que publican como siempre.
    if: ${{ needs.ci-gate.outputs.publish != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        # El input del dispatch va por `env`, no interpolado en el shell: estos jobs sostienen
        # DOCKERHUB_TOKEN y `packages: write`, así que una expresión sin sanear aquí sería
        # ejecución arbitraria con esas credenciales delante.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          NEEDS_TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag inválido: '$INPUT_TAG' (se espera vX.Y.Z)"; exit 1 ;;
            esac
            echo "ref=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [ "$GH_REF" = "refs/heads/main" ]; then
            # Auto-tag on merge: github.ref es la rama; el tag lo decidió (y creó) el ci-gate.
            case "$NEEDS_TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::tag inválido del ci-gate: '$NEEDS_TAG'"; exit 1 ;;
            esac
            echo "ref=refs/tags/${NEEDS_TAG}" >> "$GITHUB_OUTPUT"
            echo "tag=${NEEDS_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GH_REF}" >> "$GITHUB_OUTPUT"
            echo "tag=${GH_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      # El tag es lo único que decide qué se publica, y nada comprobaba que dijera la verdad.
      # Un `git tag v4.0.1` sobre un commit cuyo Cargo.toml sigue en 4.0.0 publicaba `:4.0.1`,
      # `:4.0`, `:4` y `:latest` de una imagen que reporta 4.0.0 — y el entrypoint escribe esa
      # versión en su estado, con lo que el backup automático pre-migración deja de dispararse
      # en el arranque siguiente. Además el paso del Release usa `changelog-section.sh`, que
      # falla si la sección no existe: mejor fallar aquí que con la imagen ya publicada.
      - name: Tag matches version and CHANGELOG
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          cargo_version="$(grep -m1 '^version' apps/api/Cargo.toml | cut -d'"' -f2)"
          if [ "v${cargo_version}" != "$TAG" ]; then
            echo "::error::el tag ${TAG} no coincide con apps/api/Cargo.toml (v${cargo_version})"
            exit 1
          fi
          ./scripts/changelog-section.sh "$TAG" > /dev/null

      # `:latest`, `:X` y `:X.Y` son móviles: reconstruir una versión antigua los hacía
      # RETROCEDER. El caso no es hipotético — este mismo workflow contempla reconstruir un tag
      # viejo por dispatch —, y `docker-compose.yml` usa `${FUTUREFIN_TAG:-latest}`, así que
      # quien actualice con watchtower recibiría un downgrade sobre un volumen ya migrado. Nada
      # protege el esquema de la app frente a eso: `maybe_pg_upgrade` cubre el major de
      # PostgreSQL, no las migraciones de sqlx.
      # Cada tag móvil se mueve solo si ESTE tag es el más alto de SU rango: `:latest` con el
      # más alto global, `:X` con el más alto de su major, `:X.Y` con el más alto de su minor.
      # Antes los tres colgaban del más alto global — protegía :latest en las
      # reconstrucciones, pero también impedía que reconstruir la última de un rango viejo
      # restaurase su móvil (p. ej. `:3` clavado en 3.9.0 con 3.10.0 existiendo, tras el
      # incidente de los semver vacíos). Para un release nuevo (siempre el más alto global)
      # las tres condiciones son ciertas a la vez: el comportamiento normal no cambia.
      - name: Is this the newest tag (global / major / minor)?
        id: newest
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all="$(git ls-remote --tags --refs "https://github.com/${REPO}" \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | { cat; echo "$TAG"; } | sort -Vu)"

          major="${TAG%%.*}"                # vX
          minor="${TAG%.*}"                 # vX.Y
          top_global="$(printf '%s\n' "$all" | tail -1)"
          top_major="$(printf '%s\n' "$all" | grep -E "^${major}\." | tail -1)"
          top_minor="$(printf '%s\n' "$all" | grep -E "^${minor//./\\.}\." | tail -1)"

          latest=false; majhead=false; minhead=false
          [ "$top_global" = "$TAG" ] && latest=true
          [ "$top_major"  = "$TAG" ] && majhead=true
          [ "$top_minor"  = "$TAG" ] && minhead=true

          {
            echo "value=${latest}"
            echo "major=${majhead}"
            echo "minor=${minhead}"
          } >> "$GITHUB_OUTPUT"

          echo "latest=${latest} (${top_global}) · :${major#v}=${majhead} (${top_major}) · :${minor#v}=${minhead} (${top_minor})"
          if [ "$latest" != "true" ]; then
            echo "::warning::${TAG} no es el tag más alto (${top_global}): no se moverá :latest"
          fi

      # El nombre de Docker Hub estaba a fuego. En un fork sin secretos eso no
      # fallaba en el login (que ni siquiera tenía `if:`) sino MÁS TARDE, al hacer
      # push: la lista de imágenes entra en `docker/metadata-action`, y
      # `build-push-action` empuja TODOS los tags que salen de ahí. Por eso no basta
      # con condicionar el login: hay que dejar la imagen de Docker Hub fuera de la
      # lista cuando no hay credenciales, y entonces el fork publica solo en su GHCR.
      # El nombre sale de la variable de repositorio DOCKERHUB_IMAGE (por defecto el
      # de siempre) para que un fork pueda apuntar al suyo sin tocar el workflow.
      - name: Resolve image list
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'maxlainz/futurefin' }}
        run: |
          set -euo pipefail
          images="ghcr.io/${{ github.repository_owner }}/futurefin"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"${DOCKERHUB_IMAGE}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub: ${DOCKERHUB_IMAGE}"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Sin DOCKERHUB_USERNAME: publico solo en GHCR."
          fi
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # `value=` EXPLÍCITO en los tres semver, nunca implícito: sin él, metadata-action
          # deriva la versión de `github.ref` — que solo es un tag en los push de tag. En
          # dispatches (ref=main) y en el auto-tag on merge (ref=refs/heads/main) los tres
          # semver quedaban VACÍOS en silencio y solo se publicaba `:latest`. INCIDENTE
          # (detectado 2026-08-24): toda versión publicada por dispatch desde 3.10.0
          # (3.10.0, 4.0.1, 4.0.4, 4.0.5) salió sin su `:X.Y.Z` en ambos registries, y los
          # móviles `:4`/`:4.0` se quedaron clavados en 4.0.0 — quien fijaba FUTUREFIN_TAG=4
          # llevaba semanas congelado sin ningún error. El paso «la imagen responde por su
          # tag» de abajo existe para que esta clase de fallo nunca vuelva a ser silenciosa.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.newest.outputs.minor == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.newest.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.value == 'true' }}
          # Etiquetas OCI explícitas. La imagen solo llevaba la suya propia
          # (`com.futurefin.postgres.majors`, en el Dockerfile) y ninguna estándar.
          # `image.source` es la que hace que GHCR enlace el package con este
          # repositorio y herede su README y su visibilidad; sin ella el package
          # aparece huérfano. No las dejamos a la autodetección de metadata-action
          # porque `licenses` sale de la API de licencias de GitHub, que no responde
          # igual en un repo privado ni en un fork.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=FutureFin
            org.opencontainers.image.description=Finanzas del hogar y planificación FIRE, autoalojadas en un solo contenedor con PostgreSQL incluido.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=maxlainz

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Condicionado sobre la salida del paso anterior y no sobre `secrets.*`
      # directamente: el contexto `secrets` no está disponible en las expresiones
      # `if:`, así que la presencia del secreto se resuelve una vez en bash y se
      # propaga como output.
      - name: Login to Docker Hub
        if: steps.images.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # En multi-arch las labels viajan en la config de cada imagen hija, no en
          # el índice; las anotaciones sí van en el índice, que es lo que leen GHCR
          # y Docker Hub para enlazar el package con el repositorio.
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── El guard que faltaba: la imagen debe RESPONDER por su tag de versión ──
      # `build-push-action` publica lo que salga de `meta` sin quejarse si los semver
      # vinieron vacíos (ver INCIDENTE de arriba). Preguntar al registry por el manifest
      # del tag exacto convierte ese silencio en un run rojo, antes de crear el Release.
      - name: La imagen responde por su tag de versión
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          DOCKERHUB_ENABLED: ${{ steps.images.outputs.dockerhub }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'maxlainz/futurefin' }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          echo "Verificando ghcr.io/${{ github.repository_owner }}/futurefin:${v}…"
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/futurefin:${v}" > /dev/null
          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            echo "Verificando ${DOCKERHUB_IMAGE}:${v}…"
            docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${v}" > /dev/null
          fi
          echo "OK: la imagen ${v} responde en los registries publicados."

      # Solo después de que la imagen esté publicada: un Release que anuncie una
      # versión inexistente es peor que no tener Release. Las notas salen del
      # CHANGELOG vía `scripts/changelog-section.sh` — misma fuente de verdad que
      # el backfill manual de 3.0.0…3.8.0, para que no haya dos formatos.
      # También en dispatch cuando se CREA el tag: ese caso es una versión nueva, no una
      # reconstrucción, y sin Release el guard de orden estricto bloquearía a la siguiente
      # versión para siempre. Pasó el 2026-08-24: las tres publicaciones del día fueron
      # dispatches con create_tag, ninguna creó su Release, y hubo que crearlos a mano.
      # El dispatch de RECONSTRUCCIÓN (sin create_tag) sigue sin tocar notas, que era la
      # intención original del `if` — y el «ya existe, no lo toco» de abajo lo refuerza.
      #
      # TAG viene del resolve, no de github.ref_name: en un dispatch ref_name vale «main».
      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release $TAG ya existe — no lo toco"
            exit 0
          fi
          ./scripts/changelog-section.sh "$TAG" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag

      # ── El add-on de Home Assistant apunta a la versión recién publicada ─────
      # `addon/futurefin/config.yaml` declara `version:`, y el Supervisor usa ese
      # número como tag de la imagen (`ghcr.io/maxlainz/futurefin:X.Y.Z`). Si no se
      # sube, la tienda de add-ons se queda clavada en la versión anterior para
      # siempre. Por eso el bump lo hace el mismo run que publica.
      #
      # Va por la CONTENTS API y no por `git push`: los dos checkouts de este
      # workflow usan `persist-credentials: false`, así que no hay credencial en el
      # working tree con la que empujar. La API escribe el commit directamente sobre
      # `main` con el GITHUB_TOKEN del run.
      #
      # Corre AQUÍ, al final, cuando la imagen ya está verificada en el registry y el
      # Release creado: nunca se anuncia en la tienda una versión que no existe.
      #
      # No hay bucle: un push hecho con GITHUB_TOKEN no dispara workflows (GitHub lo
      # impide para evitar recursión). El `[skip ci]` del mensaje es cinturón y
      # tirantes, no la garantía.
      #
      # Si este paso falla, la imagen y el Release YA están fuera: el add-on se queda
      # una versión por detrás y se arregla con un PR normal que suba el `version:`.
      #
      # REQUISITO (2026-08-30): el commit va autenticado como la GitHub App propia
      # `futurefin-release-bot` (secrets ADDON_BUMP_APP_ID + ADDON_BUMP_APP_PRIVATE_KEY),
      # que ES bypass actor del ruleset «Proteger main». No puede ser el GITHUB_TOKEN:
      # la app integrada de GitHub Actions NO es admisible como bypass actor en un repo
      # personal («Actor … must be part of the ruleset source or owner organization», 422),
      # y sin bypass el push directo muere con 409 «Changes must be made through a pull
      # request» — medido en el run del build de 4.4.0, que es por lo que existe este paso
      # previo. El [skip ci] del mensaje sigue evitando la reentrada: un push de una App
      # SÍ dispara workflows (a diferencia del GITHUB_TOKEN), pero [skip ci] los corta.
      - name: Token de la App para el bump del add-on
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag)
        id: addon_bump_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ADDON_BUMP_APP_ID }}
          private-key: ${{ secrets.ADDON_BUMP_APP_PRIVATE_KEY }}
      - name: Bump de la versión del add-on en main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag)
        env:
          GH_TOKEN: ${{ steps.addon_bump_token.outputs.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          path="addon/futurefin/config.yaml"

          # OJO: `-f` convierte el GET en POST (gh api cambia de método al recibir fields) —
          # el ref va como query string o esto es un 404. Incidente: el estreno en 4.3.0.
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main")"
          sha="$(printf '%s' "$meta" | jq -r .sha)"
          printf '%s' "$meta" | jq -r .content | base64 -d > "${RUNNER_TEMP}/addon-config.yaml"

          actual="$(grep -m1 '^version:' "${RUNNER_TEMP}/addon-config.yaml" | cut -d'"' -f2)"
          if [ "$actual" = "$v" ]; then
            echo "El add-on ya está en ${v}: nada que hacer."
            exit 0
          fi

          echo "Add-on ${actual} → ${v}."
          sed -i "s/^version: \".*\"$/version: \"${v}\"/" "${RUNNER_TEMP}/addon-config.yaml"

          # `base64 | tr -d '\n'`: GNU quiere -w0 y BSD no lo tiene. Portable y sin sorpresas.
          content="$(base64 < "${RUNNER_TEMP}/addon-config.yaml" | tr -d '\n')"

          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=chore(addon): versión ${v} [skip ci]" \
            -f "content=${content}" \
            -f "branch=main" \
            -f "sha=${sha}" --silent
          echo "OK: addon/futurefin/config.yaml en main apunta a ${v}."
