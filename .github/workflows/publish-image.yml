name: Publish Docker image

# Publishes on explicit semver tags (v1.0.0, v1.2.3, …).
# GHCR always; Docker Hub if DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are set.
#
# Tags published per registry:
#   vX.Y.Z  →  :1.0.0  :1.0  :1  :latest
#
# Required secrets:
#   (none)              — GHCR uses GITHUB_TOKEN automatically
#   DOCKERHUB_USERNAME  — Docker Hub user or org (optional)
#   DOCKERHUB_TOKEN     — Docker Hub access token  (optional)

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.0.0)"
        required: true

permissions:
  # `contents: write` es lo que permite crear el GitHub Release del tag; el
  # checkout sigue usando `persist-credentials: false`, así que el token solo
  # viaja como GH_TOKEN al paso que publica las notas.
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=refs/tags/${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Resolve image list
        id: images
        run: |
          images="ghcr.io/${{ github.repository_owner }}/futurefin"
          images="${images}"$'\n'"maxlainz/futurefin"
          {
            echo "list<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Solo después de que la imagen esté publicada: un Release que anuncie una
      # versión inexistente es peor que no tener Release. Las notas salen del
      # CHANGELOG vía `scripts/changelog-section.sh` — misma fuente de verdad que
      # el backfill manual de 3.0.0…3.8.0, para que no haya dos formatos.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release $TAG ya existe — no lo toco"
            exit 0
          fi
          ./scripts/changelog-section.sh "$TAG" > "${RUNNER_TEMP}/release-notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
