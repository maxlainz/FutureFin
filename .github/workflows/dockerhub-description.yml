name: Sync Docker Hub description

# `maxlainz/futurefin` es público y lleva miles de descargas con la descripción
# VACÍA: quien llega desde el buscador de Docker Hub no ve ni qué es la imagen ni
# cómo arrancarla, y no hay ningún enlace de vuelta al repositorio. Este workflow
# publica `.github/dockerhub-README.md` como página del repositorio de Docker Hub.
#
# Fichero aparte y no el README.md del repo a propósito: el de GitHub da por hecho
# el contexto del repositorio (capturas relativas, badges, enlaces a docs/…), que
# en Docker Hub aparecen rotos. Este es la versión corta y con enlaces absolutos.

on:
  push:
    branches: [main]
    paths:
      - ".github/dockerhub-README.md"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub-description:
    runs-on: ubuntu-latest
    steps:
      # Este workflow PUBLICA hacia fuera, y `workflow_dispatch` no restringe la rama: sin esta
      # guardia, un dispatch desde cualquier ref manda a Docker Hub el fichero de ESE ref —el de
      # una rama de trabajo a medio revisar, por ejemplo—. Pasó el 2026-08-22: se despachó desde
      # la rama de desarrollo para estrenar un arreglo que aún no estaba mergeado. Aquella vez no
      # se filtró nada (el fichero era idéntico), pero el camino estaba abierto. Lo que sale a
      # Docker Hub sale de `main`, que es lo único que ha pasado por PR y por CI.
      - name: Solo desde main
        if: github.ref_name != 'main'
        run: |
          echo "::error::Este workflow solo publica desde 'main' (ref actual: ${{ github.ref_name }})."
          echo "Publicar desde una rama de trabajo mandaría a Docker Hub un fichero que no ha"
          echo "pasado por PR ni por CI. Mergea a main y vuelve."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # El contexto `secrets` no está disponible en las expresiones `if:`, así que
      # la presencia de las credenciales se resuelve en bash y se propaga como
      # output. Sin esto, un fork sin secretos fallaría el job en cada push a main.
      - name: ¿Hay credenciales de Docker Hub?
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Sin secretos de Docker Hub: no hay nada que sincronizar."
          fi

      # `password` admite el token de acceso personal de Docker Hub, pero **no basta
      # con el que sirve para `docker push`**: editar los metadatos del repositorio
      # exige scope `read/write/delete`, y un token `read/write` devuelve **403
      # Forbidden** en el PATCH aunque su login haya ido bien. Es lo que pasó el
      # 2026-08-22: `publish-image.yml` publicaba la imagen sin problema y este
      # workflow moría con un «Forbidden» a secas, sin decir por qué.
      # El repositorio de destino sale de la misma variable que publish-image.yml,
      # para que ambos workflows no puedan apuntar a sitios distintos.
      - name: Publicar la descripción
        if: steps.creds.outputs.ok == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'maxlainz/futurefin' }}
          # Máximo 100 BYTES, no caracteres: cada tilde cuenta dos. La versión anterior
          # medía 101 y Docker Hub la truncaba, dejándola sin punto final.
          short-description: "Finanzas del hogar y planificación FIRE, autoalojadas en un contenedor con PostgreSQL dentro."
          readme-filepath: .github/dockerhub-README.md

      # Un «Forbidden» a secas no dice a nadie qué hacer, y este workflow se dispara
      # tan de uvas a peras que quien lo lea habrá perdido el contexto.
      - name: Por qué ha fallado
        if: failure()
        run: |
          echo "::error::La API de Docker Hub ha rechazado la actualización."
          echo "Causa más probable: DOCKERHUB_TOKEN tiene scope 'read/write' (suficiente para"
          echo "docker push, que es lo que hace publish-image.yml) pero editar la descripción"
          echo "del repositorio exige 'read/write/delete'. Un 403 aquí NO es un problema de"
          echo "este workflow ni del fichero de descripción."
          echo "Arreglo: crea un token nuevo en Docker Hub → Account Settings → Personal access"
          echo "tokens con permiso 'Read, Write, Delete' y actualiza el secreto DOCKERHUB_TOKEN.
