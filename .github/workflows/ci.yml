name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # Barato, rápido y primero: ningún dato personal entra al repositorio. Existe porque
  # hasta agosto de 2026 `apps/api/tests/fixtures/` llevaba extractos bancarios reales
  # —IBAN, nombre y nómina— y nada lo detectó. Ver la skill `futurefin-data-hygiene`.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Datos sensibles en ficheros trackeados
        run: ./scripts/scan-sensitive.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Barato y primero: si la versión de Cargo.toml no tiene sección en el
      # CHANGELOG, el paso que publica el GitHub Release en publish-image.yml
      # fallará al taguear — mejor enterarse aquí que a mitad de una release.
      # Es el agujero por el que se coló la 2.2.0: tag e imagen publicados, su
      # sección perdida del CHANGELOG, y nada avisó.
      - name: CHANGELOG cubre la versión de Cargo.toml
        run: ./scripts/audit-releases.sh --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          # clippy y rustfmt están instalados aunque sus pasos sigan comentados
          # (ver abajo): así activarlos es descomentar, no tocar dos sitios.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build -p futurefin-api --locked
      - name: cargo test (engine — no DB required)
        run: cargo test -p futurefin-engine --locked

      # ── Gates preparados pero DESACTIVADOS a propósito (2026-08-22) ──────────
      # El repo nunca ha pasado por clippy ni por rustfmt, así que activarlos hoy
      # dejaría CI en rojo desde el primer push — y una CI roja de serie enseña a
      # ignorar la CI, que es peor que no tenerla. Medido en local sobre `dev`:
      #
      #   cargo clippy --workspace --all-targets -- -D warnings
      #     → 50 avisos únicos en 20 ficheros. Los dominan needless_borrow (14),
      #       type_complexity (8) y unnecessary_map_or (7); ninguno toca aritmética
      #       de Decimal. Con `-D warnings` aborta en `crates/engine` (4 avisos) y
      #       ni siquiera llega a `apps/api`.
      #   cargo fmt --all --check
      #     → 1.175 bloques en 72 ficheros (el mayor, `tests/common/mod.rs`, con 280).
      #
      # Para activarlos: limpia primero el repo en un commit aparte —
      # `cargo clippy --workspace --all-targets --fix` (29 de los 50 tienen
      # autofix) y `cargo fmt --all` — comprueba que la suite sigue verde, y
      # entonces descomenta estos dos pasos. Un `cargo fmt --all` toca 72 ficheros
      # de golpe, así que va SOLO en su propio commit: mezclado con cambios reales
      # hace ilegible cualquier diff y cualquier `git blame`.
      # - name: cargo clippy
      #   run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # - name: cargo fmt
      #   run: cargo fmt --all --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm install
        run: npm install
      - name: typecheck
        run: npm run typecheck:web
      # lint y Vitest existían desde siempre en package.json pero nunca corrían en
      # CI: la skill `futurefin-validation-and-qa` los listaba como «obligación
      # local», es decir, dependían de que a nadie se le olvidara. Con
      # colaboradores externos eso no se sostiene. Ambos están verdes hoy
      # (eslint sin avisos; Vitest 355 tests en 16 ficheros), así que entran
      # como gates bloqueantes, no informativos.
      - name: lint
        run: npm run lint:web
      - name: vitest
        run: npm test --workspace futurefin-web
      # El build va el último: es el paso lento y no tiene sentido pagarlo si el
      # typecheck o los tests ya han fallado.
      - name: build
        run: npm run build:web

  # `cargo test --workspace` son 447 tests (medido el 2026-08-22); CI solo corría los
  # 65 del engine. Los otros 382 —329 de integración en 30 ficheros de
  # `apps/api/tests/` más 53 unitarios de la lib de la API— necesitan un Postgres de
  # verdad, así que nunca se ejecutaban: una PR podía salir verde con toda la capa de
  # handlers rota. Era el agujero de cobertura más grande del repo, documentado como
  # «obligación local» en la skill `futurefin-validation-and-qa` — o sea, dependiendo
  # de que a nadie se le olvidara. Con colaboradores externos eso no se sostiene.
  #
  # El harness (`apps/api/tests/common/mod.rs`) crea un schema `ff_test_<uuid>` por
  # test y le aplica las 42 migraciones, así que un único Postgres compartido basta y
  # los tests no se pisan entre sí. Los schemas NO se borran a propósito (un test que
  # falla deja su estado inspeccionable); aquí da igual, el contenedor muere con el job.
  #
  # Sobre conexiones: cargo ejecuta los binarios de test en serie y libtest usa un
  # hilo por core (4 en el runner), y cada test abre un pool de 5 → ~20 conexiones
  # simultáneas, muy por debajo del max_connections=100 por defecto.
  integration:
    runs-on: ubuntu-latest
    # ~3 min de tests + compilación. El tope evita que un test bloqueado se coma
    # las 6 h por defecto del runner.
    timeout-minutes: 45

    services:
      postgres:
        # Misma imagen que el `ff-test-db` local documentado en CLAUDE.md, para que
        # un fallo aquí sea reproducible en la máquina de quien manda la PR.
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: futurefin
          POSTGRES_PASSWORD: futurefin_test
          POSTGRES_DB: futurefin_test
        ports:
          - 5432:5432
        # `-h 127.0.0.1` NO es decorativo: durante el initdb la imagen oficial
        # levanta un servidor temporal que solo escucha en el socket Unix, y un
        # `pg_isready` sin host da OK antes de que la base exista. Ese flake ya nos
        # mordió en el paso de pg_upgrade de `docker-stack` (ver su comentario).
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U futurefin -d futurefin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test --workspace` cubre las tres cosas de golpe: los tests unitarios
      # del engine, los unitarios de la lib de la API y los de integración contra
      # Postgres. En local el puerto documentado es el 5433 (para no chocar con el
      # Postgres de desarrollo); aquí no hay con qué chocar, así que 5432.
      - name: cargo test --workspace (engine + integración contra Postgres)
        env:
          TEST_DATABASE_URL: postgres://futurefin:futurefin_test@127.0.0.1:5432/futurefin_test
        run: cargo test --workspace --locked

  # `main` es la rama que se publica: desde 4.0.0 la documentación interna para
  # modelos (`CLAUDE.md` y todo `.claude/`) vive solo en `dev` y no se publica.
  # El merge dev→main es completo por norma (CLAUDE.md § Git workflow), así que es
  # muy fácil arrastrarlos sin querer; este guard lo convierte en un fallo ruidoso
  # en vez de en algo que se descubre leyendo el repo público.
  #
  # Solo corre cuando el ref ES `main`: en `dev` esos ficheros son legítimos y
  # obligatorios, y hacerlo fallar ahí sería exactamente lo contrario de lo que
  # queremos.
  main-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: '`main` no publica documentación interna'
        run: |
          set -euo pipefail
          # `git ls-files` y no `ls`: lo que importa es lo que la rama PUBLICA
          # (ficheros trackeados), no lo que quede suelto en el runner.
          offenders="$(git ls-files -- CLAUDE.md .claude)"
          if [ -n "$offenders" ]; then
            echo "ERROR: main contiene documentación interna que no debe publicarse:"
            echo "$offenders"
            echo
            echo "Viven solo en 'dev'. Sácalos de main y vuelve a empujar."
            exit 1
          fi
          echo "OK: main no lleva CLAUDE.md ni .claude/"

  # Imagen autocontenida (3.x): construye y ejercita los caminos críticos del contenedor
  # único — arranque desde cero, preservación de datos V2→V3 (uid + colación), compat
  # externa (watchtower sobre compose 2.x), automigración, pg_upgrade 15→16 y apagado
  # ordenado. Es la ÚNICA evidencia automatizada de «sin pérdida de datos»: no debilitar.
  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck (entrypoint + scripts)
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning apps/api/docker-entrypoint.sh scripts/*.sh scripts/diagnostics/*.sh

      - name: Build image
        run: docker build -t futurefin-ci:latest -f apps/api/Dockerfile .

      - name: Image sanity (PG majors, label, no-volume guard)
        run: |
          set -e
          docker run --rm --entrypoint sh futurefin-ci:latest -c \
            '/usr/lib/postgresql/16/bin/postgres --version && /usr/lib/postgresql/15/bin/postgres --version'
          test "$(docker inspect -f '{{index .Config.Labels "com.futurefin.postgres.majors"}}' futurefin-ci:latest)" = "15,16"
          # Sin volumen debe ABORTAR (guardia anti-pérdida), no arrancar con datos efímeros.
          # Sin pipeline: el exit code que importa es el del contenedor, no el de tee.
          rc=0
          docker run --rm futurefin-ci:latest >/tmp/novol.log 2>&1 || rc=$?
          cat /tmp/novol.log
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: container started without a volume"; exit 1
          fi
          grep -q "no persistent volume" /tmp/novol.log

      # ── Escenario 1: instalación nueva + recreate estilo watchtower + apagado limpio ──
      - name: Fresh install → /v1/ready + seed data
        run: |
          set -e
          FUTUREFIN_IMAGE=futurefin-ci FUTUREFIN_TAG=latest docker compose -p ffresh up -d
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/v1/ready >/dev/null && break; sleep 2
            [ "$i" = 90 ] && { docker compose -p ffresh ps -a; docker compose -p ffresh logs --tail=200; exit 1; }
          done
          docker compose -p ffresh logs futurefin | grep -q "initializing fresh PostgreSQL 16"
          curl -sf -X POST http://127.0.0.1:8080/v1/auth/register -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123","birth_date":"1990-01-01"}' >/dev/null
          curl -sf -c /tmp/jar -X POST http://127.0.0.1:8080/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123"}' >/dev/null
          curl -sf -b /tmp/jar -X POST http://127.0.0.1:8080/v1/categories -H 'content-type: application/json' \
            -d '{"scope":"asset","name":"Ácido Ñandú"}' >/dev/null

      - name: Recreate (watchtower-style) keeps data
        run: |
          set -e
          FUTUREFIN_IMAGE=futurefin-ci FUTUREFIN_TAG=latest docker compose -p ffresh up -d --force-recreate
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/v1/ready >/dev/null && break; sleep 2
            [ "$i" = 60 ] && { docker compose -p ffresh logs --tail=200; exit 1; }
          done
          curl -sf -c /tmp/jar2 -X POST http://127.0.0.1:8080/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123"}' >/dev/null
          curl -sf -b /tmp/jar2 http://127.0.0.1:8080/v1/categories | grep -q 'Ácido Ñandú'

      - name: Clean shutdown (SIGTERM → API drains → PG checkpoint → exit 0)
        run: |
          set -e
          docker compose -p ffresh stop -t 60 futurefin
          docker compose -p ffresh logs futurefin > /tmp/shutdown.log
          grep -q "shutdown signal received"      /tmp/shutdown.log   # entrypoint + API
          grep -q "database pool closed"          /tmp/shutdown.log   # API cerró el pool
          grep -q "database system is shut down"  /tmp/shutdown.log   # checkpoint de PG
          grep -q "clean shutdown complete"       /tmp/shutdown.log   # supervisor
          test "$(docker inspect -f '{{.State.ExitCode}}' futurefin)" = "0"
          docker compose -p ffresh down -v --remove-orphans

      # ── Escenario 2: compose 2.x real → (a) imagen 3.x sin tocar el compose (RR7/watchtower)
      #    y después (b) migración al compose 3.x reutilizando el volumen ──
      - name: V2 stack up + seed data (2.3.0 real)
        run: |
          set -e
          POSTGRES_PASSWORD=ci-test docker compose -p futurefin -f .github/testdata/docker-compose.v2.yml up -d
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/v1/health >/dev/null && break; sleep 2
            [ "$i" = 90 ] && { docker compose -p futurefin -f .github/testdata/docker-compose.v2.yml logs --tail=200; exit 1; }
          done
          curl -sf -X POST http://127.0.0.1:8080/v1/auth/register -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123","birth_date":"1990-01-01"}' >/dev/null
          curl -sf -c /tmp/v2jar -X POST http://127.0.0.1:8080/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123"}' >/dev/null
          curl -sf -b /tmp/v2jar -X POST http://127.0.0.1:8080/v1/categories -H 'content-type: application/json' \
            -d '{"scope":"asset","name":"Ácido Ñandú"}' >/dev/null

      # 4.0.0 retiró el modo de base externa. La imagen 4.x sobre un compose 2.x sin tocar
      # (el caso de quien auto-actualiza con watchtower) ya NO arranca en modo compat: se
      # niega y explica cómo migrar. Es la conducta correcta — arrancar contra un volumen
      # vacío se leería como pérdida de datos — y por eso se fija con un test.
      - name: V4 image over untouched V2 compose → se niega a arrancar y explica cómo migrar
        run: |
          set -e
          POSTGRES_PASSWORD=ci-test docker compose -p futurefin \
            -f .github/testdata/docker-compose.v2.yml -f .github/testdata/docker-compose.v2-app-v3.yml \
            up -d futurefin || true
          # Sin pipeline: el exit code que importa es el del contenedor, no el de tee.
          for i in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Status}}' futurefin 2>/dev/null || echo missing)"
            [ "$state" = "exited" ] && break
            sleep 2
            [ "$i" = 30 ] && { docker logs futurefin --tail=100; echo "ERROR: seguía vivo"; exit 1; }
          done
          test "$(docker inspect -f '{{.State.ExitCode}}' futurefin)" != "0"
          docker logs futurefin 2>&1 > /tmp/refuse.log 2>&1 || true
          docker logs futurefin 2>&1 | grep -q "ya no habla con bases de datos externas"
          docker logs futurefin 2>&1 | grep -q "3.9.0"

      - name: Migrate to V3 compose reusing the volume (chown + REINDEX + backup)
        run: |
          set -e
          POSTGRES_PASSWORD=ci-test docker compose -p futurefin \
            -f .github/testdata/docker-compose.v2.yml -f .github/testdata/docker-compose.v2-app-v3.yml \
            down --remove-orphans
          FUTUREFIN_IMAGE=futurefin-ci FUTUREFIN_TAG=latest docker compose -p futurefin up -d --remove-orphans
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/v1/ready >/dev/null && break; sleep 2
            [ "$i" = 90 ] && { docker compose -p futurefin logs --tail=300; exit 1; }
          done
          docker compose -p futurefin logs futurefin > /tmp/v2v3.log
          grep -q "adopting ownership of PGDATA"    /tmp/v2v3.log   # uid 70 (alpine) → 999
          grep -q "reindexing database after adoption" /tmp/v2v3.log # colación musl→glibc
          # Login con las MISMAS credenciales (índice único de username sano tras REINDEX)
          curl -sf -c /tmp/v3jar -X POST http://127.0.0.1:8080/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"citest","password":"ci-test-password-123"}' >/dev/null
          curl -sf -b /tmp/v3jar http://127.0.0.1:8080/v1/categories | grep -q 'Ácido Ñandú'
          # Registrar un username duplicado debe rechazarse (409/422) — detector de índice
          # único corrupto por colación: con el índice roto esto devolvería 200 o 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"username":"citest","password":"otra-password-456","birth_date":"1991-01-01"}')
          echo "duplicate register -> $code"
          case "$code" in 409|422) ;; *) echo "ERROR: expected 409/422"; exit 1;; esac
          # Backup automático pre-migración presente en el volumen ffdata
          docker compose -p futurefin exec -T futurefin sh -c 'ls /var/lib/futurefin/backups/pre-migration-*.sql.gz'
          docker compose -p futurefin down -v --remove-orphans

      # ── Escenario 3: DATABASE_URL heredada + volumen vacío → se para, no arranca vacío ──
      # La automigración one-shot desde base externa se retiró en 4.0.0 junto con el resto
      # del modo externo. Lo que queda —y lo que hay que fijar— es que nadie acabe con una
      # instalación vacía creyendo que ha perdido sus datos.
      - name: DATABASE_URL heredada con volumen vacío → aborta con instrucciones
        run: |
          set -e
          docker volume create ffempty >/dev/null
          docker volume create ffemptystate >/dev/null
          rc=0
          docker run --name ffext \
            -e DATABASE_URL="postgres://futurefin:x@203.0.113.1:5432/futurefin" \
            -v ffempty:/var/lib/postgresql/data -v ffemptystate:/var/lib/futurefin \
            futurefin-ci:latest >/tmp/ext.log 2>&1 || rc=$?
          cat /tmp/ext.log
          [ "$rc" -ne 0 ] || { echo "ERROR: arrancó con una base externa"; exit 1; }
          grep -q "ya no habla con bases de datos externas" /tmp/ext.log
          grep -q "docs/actualizar.md" /tmp/ext.log
          # Y el volumen sigue vacío: no ha inicializado nada a medias.
          docker run --rm -v ffempty:/d alpine sh -c 'test -z "$(ls -A /d)"'
          docker rm -f ffext >/dev/null
          docker volume rm ffempty ffemptystate >/dev/null

      # ── Escenario 4: auto-pg_upgrade 15 → 16 ──
      - name: pg_upgrade 15→16 (seeded PG15 volume)
        run: |
          set -e
          docker volume create pg15data >/dev/null
          docker volume create pg15state >/dev/null
          docker run -d --name pg15seed -v pg15data:/var/lib/postgresql/data \
            -e POSTGRES_USER=futurefin -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=futurefin \
            postgres:15-bookworm
          # Sondeo por TCP a propósito: el servidor temporal de initdb solo escucha en el
          # socket Unix, así que pg_isready daba OK antes de que existiera la DB (flake).
          for i in $(seq 1 60); do
            docker exec -e PGPASSWORD=ci pg15seed \
              psql -X -q -h 127.0.0.1 -U futurefin -d futurefin -c "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
            [ "$i" = 60 ] && { docker logs pg15seed --tail=50; exit 1; }
          done
          docker exec pg15seed psql -U futurefin -d futurefin \
            -c "CREATE TABLE ci_marker(name text); INSERT INTO ci_marker VALUES ('sobrevivió-al-upgrade');"
          docker stop pg15seed && docker rm pg15seed
          docker run -d --name ffpg15 -p 8083:8080 \
            -v pg15data:/var/lib/postgresql/data -v pg15state:/var/lib/futurefin \
            futurefin-ci:latest
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8083/v1/ready >/dev/null && break; sleep 2
            [ "$i" = 120 ] && { docker logs ffpg15 --tail=300; exit 1; }
          done
          docker logs ffpg15 2>&1 | grep -q "pg_upgrade needed: PostgreSQL 15 -> 16"
          docker logs ffpg15 2>&1 | grep -q "pg_upgrade 15 -> 16 completed"
          docker exec ffpg15 psql -X -tA -h /var/run/postgresql -U futurefin -d futurefin \
            -c "SELECT name FROM ci_marker" | grep -q 'sobrevivió-al-upgrade'
          docker exec ffpg15 psql -X -tA -h /var/run/postgresql -U futurefin -d futurefin \
            -c "SHOW server_version" | grep -q '^16'
          docker exec ffpg15 sh -c 'test -d /var/lib/postgresql/data/pgdata_old_15'
          docker exec ffpg15 sh -c 'ls /var/lib/futurefin/backups/pre-pgupgrade-15-to-16-*.sql.gz'
          docker rm -f ffpg15
          docker volume rm pg15data pg15state

      - name: Cleanup
        if: always()
        run: |
          docker compose -p ffresh down -v --remove-orphans 2>/dev/null || true
          docker compose -p futurefin down -v --remove-orphans 2>/dev/null || true
          docker rm -f ffpg15 pg15seed ffext 2>/dev/null || true
          docker volume rm ffempty ffemptystate 2>/dev/null || true
