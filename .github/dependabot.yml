version: 2

# `target-branch: dev` en TODAS las entradas: sin él Dependabot usa la rama por defecto, que aquí
# es `main` — la rama de publicación, no la de desarrollo. Un bump mergeado en `main` no llega
# nunca a `dev`: CI en `dev` sigue compilando contra la versión vieja y el siguiente que regenere
# un lockfile lo revierte en silencio. Pasó: los 22 PRs de agosto de 2026 salieron todos con
# `base=main`.
#
# OJO — esto solo redirige las *version updates*. Las **security updates** (las que abre Dependabot
# al publicarse un CVE) van SIEMPRE contra la rama por defecto y no admiten `target-branch`; esas
# hay que atenderlas a mano en `main`. Y Dependabot lee ESTE fichero desde la rama por defecto,
# así que un cambio aquí no surte efecto hasta que llegue a `main` en la siguiente release.

updates:
  # Workspace de Cargo: apps/api + crates/domain + crates/engine.
  - package-ecosystem: cargo
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      cargo-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Workspace de npm: la raíz declara apps/web.
  - package-ecosystem: npm
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      npm-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Acciones usadas por los workflows de .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Imágenes base del Dockerfile de la aplicación (build de Rust, build de Node, runtime).
  # Las bases van pineadas por digest: revisa el diff antes de aceptar.
  - package-ecosystem: docker
    directory: "/apps/api"
    target-branch: "dev"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
    groups:
      docker-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
