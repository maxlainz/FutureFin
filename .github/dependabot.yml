version: 2

# Sin `target-branch`: el repositorio tiene UNA rama viva (`main`, la de por defecto), que es
# adonde Dependabot apunta por omisión. La opción estuvo aquí mientras existió `dev`, para que
# los bumps no acabaran en la rama de publicación sin pasar por la de desarrollo; al unificar
# las ramas dejó de tener sentido. Si algún día vuelve a haber dos ramas vivas, vuelve a hacer
# falta — y recuerda entonces sus dos límites: solo redirige las *version updates* (las
# security updates van siempre a la rama por defecto) y Dependabot lee este fichero desde la
# rama por defecto, así que el cambio no entra en vigor hasta que llegue a ella.

updates:
  # Workspace de Cargo: apps/api + crates/domain + crates/engine.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      cargo-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Workspace de npm: la raíz declara apps/web.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      npm-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Acciones usadas por los workflows de .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Imágenes base del Dockerfile de la aplicación (build de Rust, build de Node, runtime).
  # Las bases van pineadas por digest: revisa el diff antes de aceptar.
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    labels:
      - dependencies
    groups:
      docker-menores:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
