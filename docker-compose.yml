# Proyecto Compose (nombre visible en `docker compose ls`).
#
# Si `docker compose up` falla con «No such container», usa un arranque limpio:
#   make docker-up          o   ./scripts/docker-stack-up.sh
#   make docker-rebuild     o   ./scripts/docker-stack-up.sh --build
#
# `docker compose watch`: si :8080 muestra página en blanco, fuerza rebuild del stage web:
#   docker compose build --no-cache futurefin-api && docker compose up -d futurefin-api
# (el sync host dist→contenedor se eliminó: un dist vacío borraba la UI embebida).
name: futurefin

# Imagen de aplicación: etiqueta local `dev`; en Docker Hub usar p.ej. futurefin/futurefin-api:1.0.0
services:
  futurefin-database:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    container_name: futurefin-database
    environment:
      POSTGRES_USER: futurefin
      POSTGRES_PASSWORD: futurefin
      POSTGRES_DB: futurefin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurefin -d futurefin"]
      interval: 5s
      timeout: 5s
      retries: 5

  futurefin-api:
    image: futurefin/futurefin-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    develop:
      watch:
        # No sincronizar ./apps/web/dist → /app/web: si dist no existe o está vacío en
        # el host, se borra la UI embebida en la imagen y :8080 queda en blanco.
        - action: rebuild
          path: ./apps/api
        - action: rebuild
          path: ./crates/domain
        - action: rebuild
          path: ./apps/web
          ignore:
            - "**/node_modules/**"
            - "**/dist/**"
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    container_name: futurefin-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -f /app/web/index.html && test -n "$(ls -A /app/web/assets 2>/dev/null)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WEB_STATIC_ROOT: /app/web
      DATABASE_URL: postgres://futurefin:futurefin@futurefin-database:5432/futurefin
      RUST_LOG: futurefin_api=info,tower_http=info
      COOKIE_SECURE: "0"
      SESSION_TTL_DAYS: "30"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080
    depends_on:
      futurefin-database:
        condition: service_healthy

volumes:
  pgdata:
