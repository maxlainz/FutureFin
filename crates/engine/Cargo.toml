[package]
name = "futurefin-engine"
version = "1.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/maxlainz/FutureFin"
authors = ["Max Lainz"]
description = "Projection and FIRE simulation"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
rust_decimal = { version = "1.41", features = ["maths", "serde-with-str"] }
utoipa = { version = "5", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
# Solo para el pin dorado (`tests/golden_pins.rs`): SHA-256 del texto canónico de cada caso y
# lectura del fixture JSON. Ninguno entra en el binario ni en la API pública del motor.
# `sha2` va pineado a la MISMA versión que `apps/api` (0.10): dos versiones del mismo hash en el
# árbol es exactamente la clase de deriva que este pin existe para no tener.
serde_json = "1"
sha2 = "0.10"
